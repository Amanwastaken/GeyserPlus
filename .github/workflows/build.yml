name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: ShieldOffhand
          path: build/libs/ShieldOffhand.jar
          if-no-files-found: error
          retention-days: 90
